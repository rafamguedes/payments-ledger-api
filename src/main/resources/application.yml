server:
  port: 3000
  tomcat:
    threads:
      max: 512

spring:
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling + JDBC waits
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

payments:
  http:
    db-permits: 24      # cap DB-bound request concurrency before Hikari queues
  worker:
    threads: 4         # leave most JDBC connections available for API requests
    sweep-interval-ms: 500   # fallback sweep for any pending row missed by the queue
  datasource:
    maximum-pool-size: 32
    minimum-idle: 8
    connection-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: payments-ledger-api

logging:
  level:
    root: WARN
    com.payments: INFO
