services:
  app:
    build: .
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: "postgres://rinha:rinha@postgres:5432/rinha"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "3GB"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
      POSTGRES_DB: rinha
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha -d rinha"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1GB"
